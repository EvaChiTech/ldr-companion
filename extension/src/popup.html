<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LDR Theater</title>
  <style>
    :root {
      --ink:   #241E1C;
      --paper: #FAF6EE;
      --brand: #C4594A;
      --dim:   #7A6E68;
      --line:  rgba(36, 30, 28, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font: 14px/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    h1 {
      font-size: 15px;
      margin: 0 0 2px;
      letter-spacing: -0.01em;
    }
    .sub { font-size: 12px; color: var(--dim); margin: 0 0 14px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--dim);
      margin: 10px 0 4px;
    }
    input, select {
      width: 100%;
      appearance: none;
      font: inherit;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(196, 89, 74, 0.16);
    }
    #code { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1 1 0; min-width: 0; }
    button {
      width: 100%;
      appearance: none;
      font: inherit;
      font-weight: 700;
      padding: 9px 12px;
      margin-top: 14px;
      border: 1px solid var(--brand);
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #D26555; }
    button.off { background: transparent; color: var(--brand); }
    .note {
      font-size: 11.5px;
      color: var(--dim);
      margin: 12px 0 0;
      padding-top: 11px;
      border-top: 1px solid var(--line);
    }
    .err { font-size: 12px; color: var(--brand); margin: 8px 0 0; min-height: 16px; }
    .check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 14px 0 0;
      font-size: 12.5px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      color: var(--ink);
      cursor: pointer;
    }
    .check input {
      width: auto;
      flex: 0 0 auto;
      margin: 2px 0 0;
      accent-color: var(--brand);
      cursor: pointer;
    }
    .check small { color: var(--dim); font-size: 11px; }
    .pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(196, 89, 74, 0.12);
      color: var(--brand);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <span class="pill" id="pill">Not connected</span>
  <h1>Watch together</h1>
  <p class="sub">Use the same room code as your LDR Companion app. You each need your own subscription.</p>

  <label for="code">Room code</label>
  <input id="code" type="text" maxlength="12" placeholder="ABC123" autocomplete="off" spellcheck="false">

  <label for="seat">You are</label>
  <select id="seat">
    <option value="1">Partner 1</option>
    <option value="2">Partner 2</option>
  </select>

  <div class="row">
    <div>
      <label for="name">Your name</label>
      <input id="name" type="text" maxlength="24" placeholder="You" autocomplete="off">
    </div>
    <div>
      <label for="partner">Their name</label>
      <input id="partner" type="text" maxlength="24" placeholder="Partner" autocomplete="off">
    </div>
  </div>

  <label class="check" for="auto">
    <input id="auto" type="checkbox">
    <span>Auto-open what they open<br><small>Off: you get a one-tap “Open it” instead.</small></span>
  </label>

  <p class="err" id="err"></p>
  <button id="toggle">Connect</button>

  <p class="note">
    Open the same title on Netflix, Disney+, Max, Hulu, Prime Video or YouTube.
    Play, pause and seek stay in step; whispers and reactions float over the video.
  </p>

  <script type="module" src="popup.js"></script>
</body>
</html>
